name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-scan:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-ci-test-secret-key-ci-test-xx"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      FER_REQUIRE_SIGNED_ARTIFACT: "False"
      FER_REQUIRE_AUTH: "False"
      FER_REQUIRE_CONSENT: "True"
      FER_STORE_PREDICTIONS: "False"
      FER_RATE_LIMIT_BACKEND: "inprocess"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-bootstrap.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tooling
        run: pip install ruff==0.6.9 bandit==1.7.9 pip-audit==2.7.3

      - name: Ruff lint
        run: ruff check config core history inference ml scripts

      - name: Bandit security lint
        run: bandit -q -r config core history inference ml scripts -x inference/tests.py

      - name: pip-audit (known CVEs)
        run: pip-audit --strict --ignore-vuln GHSA-xxxx-xxxx-xxxx || true

      - name: Django system checks
        run: python manage.py check --deploy --fail-level WARNING || true

      - name: Install bootstrap dependencies (torch + transformers CPU-only)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-bootstrap.txt

      - name: Bootstrap FER model (download + export + sign)
        env:
          FER_MODEL_SIGNING_KEY: ci-signing-key-ci-signing-key-ci-signing-key-ci-signing-xx
        run: python scripts/bootstrap_model.py

      - name: Run tests
        env:
          FER_MODEL_SIGNING_KEY: ci-signing-key-ci-signing-key-ci-signing-key-ci-signing-xx
        run: python manage.py test --verbosity 2
