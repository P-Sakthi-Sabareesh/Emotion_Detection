{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotionDetect</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="topbar" role="banner">
        <div class="logo"><a href="{% url 'home' %}">EmotionDetect</a></div>
        <nav aria-label="Primary">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'prediction-hub' %}">Prediction</a>
            <a href="{% url 'about' %}">About Us</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>
        {% if request.user.is_authenticated %}
        <a class="logout-btn" href="/admin/logout/">Logout</a>
        {% else %}
        <a class="logout-btn" href="/admin/login/">Admin Login</a>
        {% endif %}
    </header>

    <main id="main-content" class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
